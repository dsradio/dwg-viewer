<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#202020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>DWG Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #141414; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 5px; padding: 7px 8px; background: #202020; border-bottom: 1px solid #333; z-index: 10; }
    .btn { background: #2e2e2e; color: #fff; border: 1px solid #444; padding: 7px 9px; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .btn:active { background: #444; }
    .btn-primary { background: #e65100; border-color: #ff6d00; font-weight: 600; }
    .btn-active { background: #2e7d32; border-color: #4caf50; font-weight: 600; }
    #status { margin-left: auto; font-size: 11px; color: #bbb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34%; }
    canvas { flex: 1; width: 100%; height: 100%; touch-action: none; display: block; }
    input[type="file"] { display: none; }

    #panel {
      display: none; position: fixed; left: 8px; right: 8px; bottom: 10px;
      background: rgba(26, 26, 26, 0.96); border: 1px solid #444; border-radius: 10px;
      padding: 10px; z-index: 20; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    #panel.open { display: block; }
    .panel-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .panel-info { font-size: 13px; font-weight: 600; color: #00e676; margin-bottom: 6px; }
    .panel-input {
      width: 72px; background: #141414; color: #fff; border: 1px solid #555;
      border-radius: 5px; padding: 5px 7px; font-size: 13px;
    }
    .stakes-box {
      margin-top: 8px; max-height: 110px; overflow-y: auto;
      background: #121212; border: 1px solid #2c2c2c; border-radius: 6px;
      padding: 6px 8px; font-family: ui-monospace, monospace; font-size: 11px; color: #ddd;
      line-height: 1.45;
    }
  </style>
</head>
<body>

<header>
  <label class="btn btn-primary">
    DWG
    <input type="file" id="fileInput" accept=".dwg">
  </label>
  <button class="btn" id="fitBtn">Центровать</button>
  <button class="btn" id="rulerBtn">Линейка</button>
  <button class="btn" id="areaBtn">Площадь</button>
  <button class="btn" id="arcBtn">Дуга</button>
  <div id="status">Загрузка...</div>
</header>

<canvas id="canvas"></canvas>

<div id="panel">
  <div id="panelInfo" class="panel-info"></div>
  <div id="areaControls" class="panel-row" style="display:none;">
    <button class="btn" id="undoPtBtn">Назад</button>
    <button class="btn" id="clearToolBtn">Сброс</button>
    <label style="margin-left:auto; display:flex; align-items:center; gap:5px; color:#ccc;">
      H (м):
      <input type="number" id="heightInput" class="panel-input" step="0.01" min="0" placeholder="0.20">
    </label>
  </div>
  <div id="arcControls" class="panel-row" style="display:none;">
    <button class="btn" id="arcClearBtn">Сброс</button>
    <label style="display:flex; align-items:center; gap:4px; color:#ccc;">
      Шаг (м):
      <input type="number" id="stepInput" class="panel-input" style="width:64px;" step="0.1" min="0.1" value="0.5">
    </label>
    <span id="arcHint" style="color:#aaa; margin-left:auto;">1: начало, 2: изгиб, 3: конец</span>
  </div>
  <div id="stakesBox" class="stakes-box" style="display:none;"></div>
</div>

<script type="module">
  import { LibreDwg, Dwg_File_Type } from 'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/dist/libredwg-web.js';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const fileInput = document.getElementById('fileInput');
  const fitBtn = document.getElementById('fitBtn');
  const rulerBtn = document.getElementById('rulerBtn');
  const areaBtn = document.getElementById('areaBtn');
  const arcBtn = document.getElementById('arcBtn');

  const panel = document.getElementById('panel');
  const panelInfo = document.getElementById('panelInfo');
  const areaControls = document.getElementById('areaControls');
  const arcControls = document.getElementById('arcControls');
  const heightInput = document.getElementById('heightInput');
  const stepInput = document.getElementById('stepInput');
  const stakesBox = document.getElementById('stakesBox');
  const arcHint = document.getElementById('arcHint');

  let libredwg = null;
  let blocks = {};
  let layers = {};
  let bakedPaths = new Map();
  let bakedTexts = [];
  let snapPoints = [];
  let snapSegments = [];
  let bounds = null;

  let scale = 1, offsetX = 0, offsetY = 0;
  let rafId = null;

  // Режимы: null | 'ruler' | 'area' | 'arc'
  let toolMode = null;
  let measurePts = [];
  let areaPts = [];
  let arcPts = [];
  let activeDragIdx = null;
  let activeDragList = null; // 'measure' | 'area' | 'arc'

  const ACI = {
    1: '#ff3b30', 2: '#ffd60a', 3: '#34c759', 4: '#32ade6',
    5: '#0a84ff', 6: '#ff2d55', 7: '#e5e5e5', 8: '#8e8e93', 9: '#c7c7cc',
    10: '#ff3b30', 30: '#ff9500', 40: '#ffcc00', 50: '#a8e61d',
    90: '#30d158', 130: '#5ac8fa', 150: '#007aff', 170: '#5856d6',
    210: '#af52de', 230: '#ff2d55', 250: '#48484a', 251: '#636366',
    252: '#8e8e93', 253: '#aeaeb2', 254: '#d1d1d6', 255: '#ffffff'
  };

  function aciToHex(idx) {
    const i = Math.abs(idx || 7);
    if (ACI[i]) return ACI[i];
    if (i >= 10 && i <= 249) {
      const hue = Math.round(((i - 10) / 240) * 360);
      return `hsl(${hue}, 80%, 60%)`;
    }
    return '#e5e5e5';
  }

  function resolveColor(e, parentColor = '#e5e5e5') {
    if (e.color && typeof e.color === 'number' && e.color > 0) {
      return '#' + (e.color & 0xffffff).toString(16).padStart(6, '0');
    }
    const ci = e.colorIndex;
    if (ci === 0) return parentColor;
    if (ci !== undefined && ci !== null && ci !== 256) return aciToHex(ci);
    return layers[e.layer] || parentColor;
  }

  (async () => {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/wasm',
      'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/dist',
      'https://unpkg.com/@mlightcad/libredwg-web/wasm'
    ];
    for (const url of urls) {
      try {
        libredwg = await LibreDwg.create(url);
        statusEl.textContent = 'Готов';
        return;
      } catch (e) {}
    }
    statusEl.textContent = 'Ошибка WASM';
  })();

  function requestDraw() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      draw();
    });
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    requestDraw();
  }
  window.addEventListener('resize', resize);
  resize();

  function setTool(nextMode) {
    activeDragIdx = null;
    activeDragList = null;
    toolMode = toolMode === nextMode ? null : nextMode;

    rulerBtn.classList.toggle('btn-active', toolMode === 'ruler');
    areaBtn.classList.toggle('btn-active', toolMode === 'area');
    arcBtn.classList.toggle('btn-active', toolMode === 'arc');

    panel.classList.toggle('open', toolMode === 'area' || toolMode === 'arc');
    areaControls.style.display = toolMode === 'area' ? 'flex' : 'none';
    arcControls.style.display = toolMode === 'arc' ? 'flex' : 'none';
    stakesBox.style.display = 'none';

    if (toolMode === 'ruler') {
      const pt = findSnap(canvas.clientWidth / 2, canvas.clientHeight / 2);
      measurePts = [pt];
      statusEl.textContent = 'Тащи точку 1';
    } else if (toolMode === 'area') {
      areaPts = [];
      updateAreaPanel();
      statusEl.textContent = 'Тапай контур';
    } else if (toolMode === 'arc') {
      arcPts = [];
      updateArcPanel();
      statusEl.textContent = 'Дуга: 3 точки';
    } else {
      statusEl.textContent = 'Готов';
    }
    requestDraw();
  }

  rulerBtn.addEventListener('click', () => setTool('ruler'));
  areaBtn.addEventListener('click', () => setTool('area'));
  arcBtn.addEventListener('click', () => setTool('arc'));

  document.getElementById('undoPtBtn').addEventListener('click', () => {
    areaPts.pop();
    updateAreaPanel();
    requestDraw();
  });
  document.getElementById('clearToolBtn').addEventListener('click', () => {
    areaPts = [];
    updateAreaPanel();
    requestDraw();
  });
  heightInput.addEventListener('input', updateAreaPanel);

  document.getElementById('arcClearBtn').addEventListener('click', () => {
    arcPts = [];
    stakesBox.style.display = 'none';
    updateArcPanel();
    requestDraw();
  });
  stepInput.addEventListener('input', () => {
    if (arcPts.length === 3) updateArcPanel();
  });

  // Расчёт площади и периметра (предполагаем чертёж в мм; если < 50 ед., трактуем как метры)
  function calcPolygonStats(pts) {
    if (pts.length < 3) return null;
    let area2 = 0, perim = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      area2 += a.x * b.y - b.x * a.y;
      perim += Math.hypot(b.x - a.x, b.y - a.y);
    }
    const rawArea = Math.abs(area2) / 2;
    const isMeters = rawArea < 200;
    const areaM2 = isMeters ? rawArea : rawArea / 1e6;
    const perimM = isMeters ? perim : perim / 1000;
    return { areaM2, perimM };
  }

  function updateAreaPanel() {
    const st = calcPolygonStats(areaPts);
    if (!st) {
      panelInfo.textContent = `Точек: ${areaPts.length} (нужно минимум 3 для замкнутого контура)`;
      return;
    }
    const h = parseFloat(heightInput.value);
    const volText = (Number.isFinite(h) && h > 0) ? ` | Объём: ${(st.areaM2 * h).toFixed(3)} м³` : '';
    panelInfo.textContent = `Площадь: ${st.areaM2.toFixed(2)} м² | Периметр: ${st.perimM.toFixed(2)} м${volText}`;
  }

  // Геометрия дуги по 3 точкам (P1 = начало, P2 = точка на дуге, P3 = конец)
  function solveArc3Pts(p1, p2, p3) {
    const d = 2 * (p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y));
    if (Math.abs(d) < 1e-7) return null;

    const p1sq = p1.x * p1.x + p1.y * p1.y;
    const p2sq = p2.x * p2.x + p2.y * p2.y;
    const p3sq = p3.x * p3.x + p3.y * p3.y;

    const cx = (p1sq * (p2.y - p3.y) + p2sq * (p3.y - p1.y) + p3sq * (p1.y - p2.y)) / d;
    const cy = (p1sq * (p3.x - p2.x) + p2sq * (p1.x - p3.x) + p3sq * (p2.x - p1.x)) / d;
    const center = { x: cx, y: cy };
    const radius = Math.hypot(p1.x - cx, p1.y - cy);

    const a1 = Math.atan2(p1.y - cy, p1.x - cx);
    const a2 = Math.atan2(p2.y - cy, p2.x - cx);
    const a3 = Math.atan2(p3.y - cy, p3.x - cx);

    const norm = (ang) => (ang + Math.PI * 2) % (Math.PI * 2);
    const ccw12 = norm(a2 - a1);
    const ccw13 = norm(a3 - a1);
    const antiClockwise = ccw12 < ccw13;

    // Хорда от P1 к P3
    const chordLen = Math.hypot(p3.x - p1.x, p3.y - p1.y);
    const chordAngle = Math.atan2(p3.y - p1.y, p3.x - p1.x);
    // Единичный вектор перпендикуляра к хорде в сторону точки P2
    const nx = -Math.sin(chordAngle), ny = Math.cos(chordAngle);
    const sideSign = ((p2.x - p1.x) * nx + (p2.y - p1.y) * ny) >= 0 ? 1 : -1;
    const px = nx * sideSign, py = ny * sideSign;

    // Для каждой позиции s вдоль хорды (0..chordLen) находим пересечение луча (P1 + s*dir + t*perp) с окружностью радиуса R
    const ux = Math.cos(chordAngle), uy = Math.sin(chordAngle);
    const getOffsetAt = (s) => {
      const ox = p1.x + ux * s;
      const oy = p1.y + uy * s;
      // (ox + t*px - cx)^2 + (oy + t*py - cy)^2 = R^2
      const rx = ox - cx, ry = oy - cy;
      const b = 2 * (rx * px + ry * py);
      const c = rx * rx + ry * ry - radius * radius;
      const disc = b * b - 4 * c;
      if (disc < 0) return 0;
      const t1 = (-b + Math.sqrt(disc)) / 2;
      const t2 = (-b - Math.sqrt(disc)) / 2;
      // Выбираем ближайший положительный/небольшой перпендикуляр к дуге
      const candidates = [t1, t2].filter(t => t >= -radius * 0.5);
      if (!candidates.length) return 0;
      candidates.sort((a, bVal) => Math.abs(a) - Math.abs(bVal));
      return candidates[0];
    };

    return { center, radius, a1, a3, antiClockwise, chordLen, ux, uy, px, py, getOffsetAt };
  }

  function formatLen(val) {
    const abs = Math.abs(val);
    if (abs < 50) return `${val.toFixed(2)} м`;
    return `${val.toFixed(0)} мм (${(val / 1000).toFixed(2)} м)`;
  }

  function updateArcPanel() {
    if (arcPts.length < 3) {
      panelInfo.textContent = `Точек дуги: ${arcPts.length} / 3`;
      arcHint.textContent = arcPts.length === 0 ? '1: начало' : arcPts.length === 1 ? '2: изгиб' : '3: конец';
      stakesBox.style.display = 'none';
      return;
    }

    const info = solveArc3Pts(arcPts[0], arcPts[1], arcPts[2]);
    if (!info) {
      panelInfo.textContent = 'Точки на одной прямой — не дуга';
      stakesBox.style.display = 'none';
      return;
    }

    const isMeters = info.radius < 50;
    const rMeters = isMeters ? info.radius : info.radius / 1000;
    const cMeters = isMeters ? info.chordLen : info.chordLen / 1000;

    panelInfo.textContent = `R = ${formatLen(info.radius)} | Хорда = ${formatLen(info.chordLen)}`;
    arcHint.textContent = `Шнурка: ${cMeters.toFixed(2)} м`;

    const stepM = Math.max(0.1, parseFloat(stepInput.value) || 0.5);
    const stepRaw = isMeters ? stepM : stepM * 1000;

    const lines = [];
    lines.push('От шнурки (начало → конец) перпендикуляр к дуге:');
    for (let s = stepRaw; s < info.chordLen - stepRaw * 0.25; s += stepRaw) {
      const off = info.getOffsetAt(s);
      const sM = isMeters ? s : s / 1000;
      lines.push(`  ${sM.toFixed(2)} м → ${formatLen(off)}`);
    }
    // Середина хорды как контрольная точка
    const midOff = info.getOffsetAt(info.chordLen / 2);
    lines.push(`  центр хорды (${(cMeters / 2).toFixed(2)} м) → ${formatLen(midOff)}`);
    lines.push(`Колышек в центр: 2 рулетки по R = ${rMeters.toFixed(2)} м от концов.`);

    stakesBox.textContent = lines.join('\n');
    stakesBox.style.display = 'block';
  }

  function cleanText(raw) {
    if (raw === undefined || raw === null) return '';
    return String(raw)
      .replace(/\\P/g, ' ')
      .replace(/\\[A-Za-z][^;]*;/g, '')
      .replace(/[{}]/g, '')
      .replace(/%%[cC]/g, 'Ø')
      .replace(/%%[dD]/g, '°')
      .replace(/%%[pP]/g, '±')
      .trim();
  }

  function tx(m, x, y) {
    return [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]];
  }

  function walkEntities(list, fn, depth = 0, m = [1, 0, 0, 1, 0, 0], parentColor = '#e5e5e5') {
    if (depth > 8 || !list) return;
    for (const e of list) {
      const col = resolveColor(e, parentColor);
      const bName = e.name || e.blockName;
      if (e.type === 'INSERT' && bName && blocks[bName]) {
        const ip = e.insertionPoint || { x: 0, y: 0 };
        const sx = e.xScale ?? 1, sy = e.yScale ?? 1;
        const rot = e.rotation || 0;
        const c = Math.cos(rot), s = Math.sin(rot);
        const nm = [
          m[0]*c*sx + m[2]*s*sx,
          m[1]*c*sx + m[3]*s*sx,
          m[0]*(-s)*sy + m[2]*c*sy,
          m[1]*(-s)*sy + m[3]*c*sy,
          m[0]*ip.x + m[2]*ip.y + m[4],
          m[1]*ip.x + m[3]*ip.y + m[5]
        ];
        walkEntities(blocks[bName], fn, depth + 1, nm, col);
      } else if (e.type && e.type.startsWith('DIMENSION')) {
        if (bName && blocks[bName]) {
          walkEntities(blocks[bName], fn, depth + 1, m, col);
        } else {
          fn(e, m, col);
        }
      } else {
        fn(e, m, col);
      }
    }
  }

  function bakeGeometry(entities) {
    const paths = new Map();
    const texts = [];
    const snaps = [];
    const segs = [];
    const skipped = {};
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    const getPath = (col) => {
      let p = paths.get(col);
      if (!p) { p = new Path2D(); paths.set(col, p); }
      return p;
    };

    const addBound = (px, py, isSnap = false) => {
      if (!Number.isFinite(px) || !Number.isFinite(py)) return;
      if (Math.abs(px) > 1e8 || Math.abs(py) > 1e8) return;
      if (px < minX) minX = px;
      if (py < minY) minY = py;
      if (px > maxX) maxX = px;
      if (py > maxY) maxY = py;
      if (isSnap && snaps.length < 120000) snaps.push(px, py);
    };

    const addSeg = (x1, y1, x2, y2) => {
      if (segs.length < 200000) segs.push(x1, y1, x2, y2);
    };

    walkEntities(entities, (e, m, col) => {
      const t = e.type || '';

      if (t === 'LINE' && e.startPoint && e.endPoint) {
        const [x1, y1] = tx(m, e.startPoint.x, e.startPoint.y);
        const [x2, y2] = tx(m, e.endPoint.x, e.endPoint.y);
        const p = getPath(col);
        p.moveTo(x1, y1);
        p.lineTo(x2, y2);
        addBound(x1, y1, true);
        addBound(x2, y2, true);
        addSeg(x1, y1, x2, y2);
      } else if (t.includes('POLYLINE') && e.vertices?.length > 1) {
        const p = getPath(col);
        let [px, py] = tx(m, e.vertices[0].x, e.vertices[0].y);
        const [x0, y0] = [px, py];
        p.moveTo(x0, y0);
        addBound(x0, y0, true);
        for (let i = 1; i < e.vertices.length; i++) {
          const [xi, yi] = tx(m, e.vertices[i].x, e.vertices[i].y);
          p.lineTo(xi, yi);
          addBound(xi, yi, true);
          addSeg(px, py, xi, yi);
          px = xi; py = yi;
        }
        if (e.flag & 1) {
          p.lineTo(x0, y0);
          addSeg(px, py, x0, y0);
        }
      } else if (t === 'CIRCLE' && e.center) {
        const [cx, cy] = tx(m, e.center.x, e.center.y);
        const r = e.radius * Math.hypot(m[0], m[1]);
        if (r > 0 && Number.isFinite(r)) {
          const p = getPath(col);
          p.moveTo(cx + r, cy);
          p.arc(cx, cy, r, 0, Math.PI * 2);
          addBound(cx, cy, true);
          addBound(cx - r, cy - r);
          addBound(cx + r, cy + r);
        }
      } else if (t === 'ARC' && e.center) {
        const [cx, cy] = tx(m, e.center.x, e.center.y);
        const r = e.radius * Math.hypot(m[0], m[1]);
        if (r > 0 && Number.isFinite(r)) {
          const p = getPath(col);
          const sx = cx + Math.cos(e.startAngle) * r;
          const sy = cy + Math.sin(e.startAngle) * r;
          const ex = cx + Math.cos(e.endAngle) * r;
          const ey = cy + Math.sin(e.endAngle) * r;
          p.moveTo(sx, sy);
          p.arc(cx, cy, r, e.startAngle, e.endAngle);
          addBound(cx, cy, true);
          addBound(sx, sy, true);
          addBound(ex, ey, true);
        }
      } else if (t === 'SPLINE') {
        const pts = e.fitPoints?.length ? e.fitPoints : e.controlPoints;
        if (pts && pts.length > 1) {
          const p = getPath(col);
          let [px, py] = tx(m, pts[0].x, pts[0].y);
          p.moveTo(px, py);
          addBound(px, py, true);
          for (let i = 1; i < pts.length; i++) {
            const [xi, yi] = tx(m, pts[i].x, pts[i].y);
            p.lineTo(xi, yi);
            addBound(xi, yi);
            addSeg(px, py, xi, yi);
            px = xi; py = yi;
          }
        }
      } else if (t === 'ELLIPSE' && e.center && e.majorAxisEndPoint) {
        const [cx, cy] = tx(m, e.center.x, e.center.y);
        const sc = Math.hypot(m[0], m[1]);
        const rx = Math.hypot(e.majorAxisEndPoint.x, e.majorAxisEndPoint.y) * sc;
        const ry = rx * (e.axisRatio || 1);
        const rot = Math.atan2(e.majorAxisEndPoint.y, e.majorAxisEndPoint.x);
        const start = e.startAngle ?? 0;
        const end = e.endAngle ?? Math.PI * 2;
        if (rx > 0 && ry > 0) {
          const p = getPath(col);
          p.moveTo(
            cx + rx * Math.cos(start) * Math.cos(rot) - ry * Math.sin(start) * Math.sin(rot),
            cy + rx * Math.cos(start) * Math.sin(rot) + ry * Math.sin(start) * Math.cos(rot)
          );
          p.ellipse(cx, cy, rx, ry, rot, start, end);
          addBound(cx, cy, true);
        }
      } else if (t === 'SOLID' || t === '3DFACE' || t === 'TRACE') {
        const pts = [e.corner1, e.corner2, e.corner4, e.corner3].filter(Boolean);
        if (pts.length >= 3) {
          const p = getPath(col);
          let [x0, y0] = tx(m, pts[0].x, pts[0].y);
          let px = x0, py = y0;
          p.moveTo(x0, y0);
          addBound(x0, y0, true);
          for (let i = 1; i < pts.length; i++) {
            const [xi, yi] = tx(m, pts[i].x, pts[i].y);
            p.lineTo(xi, yi);
            addBound(xi, yi, true);
            addSeg(px, py, xi, yi);
            px = xi; py = yi;
          }
          p.lineTo(x0, y0);
          addSeg(px, py, x0, y0);
        }
      } else if (t === 'LEADER' && e.vertices?.length > 1) {
        const p = getPath(col);
        let [px, py] = tx(m, e.vertices[0].x, e.vertices[0].y);
        p.moveTo(px, py);
        addBound(px, py, true);
        for (let i = 1; i < e.vertices.length; i++) {
          const [xi, yi] = tx(m, e.vertices[i].x, e.vertices[i].y);
          p.lineTo(xi, yi);
          addBound(xi, yi, true);
          addSeg(px, py, xi, yi);
          px = xi; py = yi;
        }
      } else if (t === 'HATCH' && e.boundaryPaths) {
        const p = getPath(col);
        for (const bp of e.boundaryPaths) {
          const verts = bp.vertices || bp.polylinePath?.vertices;
          if (verts?.length > 1) {
            let [x0, y0] = tx(m, verts[0].x, verts[0].y);
            let px = x0, py = y0;
            p.moveTo(x0, y0);
            addBound(x0, y0);
            for (let i = 1; i < verts.length; i++) {
              const [xi, yi] = tx(m, verts[i].x, verts[i].y);
              p.lineTo(xi, yi);
              addBound(xi, yi);
              addSeg(px, py, xi, yi);
              px = xi; py = yi;
            }
            p.lineTo(x0, y0);
          } else if (bp.edges) {
            for (const ed of bp.edges) {
              if (ed.start && ed.end) {
                const [x1, y1] = tx(m, ed.start.x, ed.start.y);
                const [x2, y2] = tx(m, ed.end.x, ed.end.y);
                p.moveTo(x1, y1);
                p.lineTo(x2, y2);
                addBound(x1, y1);
                addBound(x2, y2);
                addSeg(x1, y1, x2, y2);
              }
            }
          }
        }
      } else if (t === 'TEXT' || t === 'MTEXT' || t === 'ATTRIB' || t === 'ATTDEF') {
        const pt = e.startPoint || e.insertionPoint || e.position || e.alignmentPoint;
        const str = cleanText(e.text ?? e.textString ?? e.contents);
        if (pt && str) {
          const [px, py] = tx(m, pt.x, pt.y);
          const hVal = (e.textHeight || e.height || 2.5) * Math.hypot(m[0], m[1]);
          texts.push({ x: px, y: py, str, h: hVal, rot: e.rotation || 0, col });
        }
      } else if (t.startsWith('DIMENSION')) {
        const pt = e.textPoint || e.middleOfText || e.definitionPoint;
        let str = cleanText(e.text ?? e.textString);
        if (!str || str === '<>') {
          if (Number.isFinite(e.measurement)) str = String(Math.round(e.measurement));
        }
        if (pt && str) {
          const [px, py] = tx(m, pt.x, pt.y);
          const hVal = (e.textHeight || e.height || 2.5) * Math.hypot(m[0], m[1]);
          texts.push({ x: px, y: py, str, h: hVal, rot: e.rotation || 0, col });
        }
      } else if (t && t !== 'POINT' && t !== 'VIEWPORT' && t !== 'WIPEOUT') {
        skipped[t] = (skipped[t] || 0) + 1;
      }
    });

    bakedPaths = paths;
    bakedTexts = texts;
    snapPoints = snaps;
    snapSegments = segs;
    bounds = minX < Infinity ? { minX, minY, maxX, maxY } : null;
    return skipped;
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !libredwg) return;

    const sizeMB = (file.size / 1024 / 1024).toFixed(1);
    statusEl.textContent = `Читаю (${sizeMB} МБ)...`;
    await new Promise(r => setTimeout(r, 30));

    try {
      const buffer = await file.arrayBuffer();
      const dwg = libredwg.dwg_read_data(new Uint8Array(buffer), Dwg_File_Type.DWG);
      if (!dwg) {
        statusEl.textContent = `Не прочитан (${sizeMB} МБ)`;
        return;
      }

      const db = libredwg.convert(dwg);
      libredwg.dwg_free(dwg);

      layers = {};
      for (const l of (db.tables?.LAYER?.entries || [])) {
        if (!l.name) continue;
        layers[l.name] = (l.color && typeof l.color === 'number' && l.color > 0)
          ? '#' + (l.color & 0xffffff).toString(16).padStart(6, '0')
          : aciToHex(l.colorIndex ?? 7);
      }

      blocks = {};
      for (const b of (db.tables?.BLOCK_RECORD?.entries || [])) {
        if (b.name && b.entities) blocks[b.name] = b.entities;
      }

      let entities = db.entities || [];
      if (!entities.length && blocks['*Paper_Space']?.length) {
        entities = blocks['*Paper_Space'];
      }

      measurePts = [];
      areaPts = [];
      arcPts = [];
      activeDragIdx = null;
      activeDragList = null;

      if (!entities.length) {
        bakedPaths.clear();
        bakedTexts = [];
        snapPoints = [];
        snapSegments = [];
        bounds = null;
        statusEl.textContent = 'Пусто (0 эл.)';
        requestDraw();
        return;
      }

      statusEl.textContent = `Сборка (${entities.length} эл.)...`;
      await new Promise(r => setTimeout(r, 15));

      const skipped = bakeGeometry(entities);
      fitToScreen();

      const skipTop = Object.entries(skipped).sort((a, b) => b[1] - a[1]).slice(0, 2)
        .map(([k, v]) => `${k}:${v}`).join(' ');
      statusEl.textContent = skipTop ? `скрыто: ${skipTop}` : `${entities.length} эл. | OK`;
    } catch (err) {
      statusEl.textContent = `Сбой: ${err.message || err}`;
      console.error(err);
    }
  });

  function fitToScreen() {
    if (!bounds) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const bw = bounds.maxX - bounds.minX || 1;
    const bh = bounds.maxY - bounds.minY || 1;
    scale = Math.min(w / bw, h / bh) * 0.9;
    offsetX = w / 2 - ((bounds.minX + bounds.maxX) / 2) * scale;
    offsetY = h / 2 + ((bounds.minY + bounds.maxY) / 2) * scale;
    requestDraw();
  }
  fitBtn.addEventListener('click', fitToScreen);

  function screenToWorld(sx, sy) {
    return [(sx - offsetX) / scale, (offsetY - sy) / scale];
  }

  function worldToScreen(wx, wy) {
    return [offsetX + wx * scale, offsetY - wy * scale];
  }

  function findSnap(sx, sy) {
    let bestDist = 26 * 26;
    let bestPt = null;
    for (let i = 0; i < snapPoints.length; i += 2) {
      const [px, py] = worldToScreen(snapPoints[i], snapPoints[i + 1]);
      const d = (px - sx) * (px - sx) + (py - sy) * (py - sy);
      if (d < bestDist) {
        bestDist = d;
        bestPt = { x: snapPoints[i], y: snapPoints[i + 1], snapType: 'point' };
      }
    }
    if (bestPt) return bestPt;

    let bestSegDist = 20 * 20;
    let bestSegPt = null;
    for (let i = 0; i < snapSegments.length; i += 4) {
      const [x1, y1] = worldToScreen(snapSegments[i], snapSegments[i + 1]);
      const [x2, y2] = worldToScreen(snapSegments[i + 2], snapSegments[i + 3]);
      const dx = x2 - x1, dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq < 1) continue;
      let t = ((sx - x1) * dx + (sy - y1) * dy) / lenSq;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      const projX = x1 + t * dx;
      const projY = y1 + t * dy;
      const d = (projX - sx) * (projX - sx) + (projY - sy) * (projY - sy);
      if (d < bestSegDist) {
        bestSegDist = d;
        bestSegPt = {
          x: snapSegments[i] + t * (snapSegments[i + 2] - snapSegments[i]),
          y: snapSegments[i + 1] + t * (snapSegments[i + 3] - snapSegments[i + 1]),
          snapType: 'line'
        };
      }
    }
    if (bestSegPt) return bestSegPt;

    const [wx, wy] = screenToWorld(sx, sy);
    return { x: wx, y: wy, snapType: null };
  }

  function snapColor(snapType) {
    if (snapType === 'point') return '#00e676';
    if (snapType === 'line') return '#00e5ff';
    return '#ff9100';
  }

  function drawLoupe(pt) {
    const r = 68;
    const cx = 16 + r;
    const cy = 16 + r;
    const loupeScale = scale * 3.0;
    const col = snapColor(pt.snapType);

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#101010';
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    if (bakedPaths.size) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(loupeScale, -loupeScale);
      ctx.translate(-pt.x, -pt.y);
      ctx.lineWidth = 1.4 / loupeScale;
      for (const [c, path] of bakedPaths) {
        ctx.strokeStyle = c;
        ctx.stroke(path);
      }
      ctx.restore();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();

    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - 7, cy - 7, 14, 14);
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  function drawPointHandle(sx, sy, snapType, isActive, labelText = '') {
    const col = snapColor(snapType);
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx, sy, 15, 0, Math.PI * 2);
    ctx.fillStyle = isActive ? 'rgba(0, 230, 118, 0.25)' : 'rgba(255, 255, 255, 0.12)';
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeRect(sx - 4, sy - 4, 8, 8);
    if (labelText) {
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(labelText, sx + 10, sy - 8);
    }
    ctx.restore();
  }

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    if (bakedPaths.size) {
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, -scale);
      ctx.lineWidth = 1 / scale;
      for (const [col, path] of bakedPaths) {
        ctx.strokeStyle = col;
        ctx.stroke(path);
      }
      ctx.restore();
    }

    for (let i = 0; i < bakedTexts.length; i++) {
      const t = bakedTexts[i];
      const pxH = t.h * scale;
      if (pxH < 5) continue;
      const [sx, sy] = worldToScreen(t.x, t.y);
      if (sx < -200 || sx > w + 200 || sy < -50 || sy > h + 50) continue;

      ctx.save();
      ctx.translate(sx, sy);
      if (t.rot) ctx.rotate(-t.rot);
      ctx.fillStyle = t.col || '#ffd54f';
      ctx.font = `${Math.min(pxH, 60)}px sans-serif`;
      ctx.fillText(t.str, 0, 0);
      ctx.restore();
    }

    // 1. Линейка
    if (measurePts.length) {
      const ptsScreen = measurePts.map(p => {
        const [sx, sy] = worldToScreen(p.x, p.y);
        return { sx, sy, snapType: p.snapType };
      });

      if (ptsScreen.length === 2) {
        const [a, b] = ptsScreen;
        ctx.save();
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(a.sx, a.sy);
        ctx.lineTo(b.sx, b.sy);
        ctx.stroke();
        ctx.restore();

        const dist = Math.hypot(measurePts[1].x - measurePts[0].x, measurePts[1].y - measurePts[0].y);
        const label = dist >= 1000 ? `${dist.toFixed(0)} (${(dist / 1000).toFixed(2)} м)` : dist.toFixed(2);
        const mx = (a.sx + b.sx) / 2;
        const my = (a.sy + b.sy) / 2 - 14;

        ctx.save();
        ctx.font = 'bold 14px system-ui, sans-serif';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(mx - tw / 2 - 6, my - 15, tw + 12, 22);
        ctx.fillStyle = '#00e676';
        ctx.textAlign = 'center';
        ctx.fillText(label, mx, my);
        ctx.restore();
      }

      for (let i = 0; i < ptsScreen.length; i++) {
        drawPointHandle(ptsScreen[i].sx, ptsScreen[i].sy, ptsScreen[i].snapType, activeDragList === 'measure' && activeDragIdx === i);
      }
    }

    // 2. Площадь / Объём
    if (areaPts.length) {
      const sPts = areaPts.map(p => {
        const [sx, sy] = worldToScreen(p.x, p.y);
        return { sx, sy, snapType: p.snapType };
      });

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sPts[0].sx, sPts[0].sy);
      for (let i = 1; i < sPts.length; i++) ctx.lineTo(sPts[i].sx, sPts[i].sy);
      if (sPts.length >= 3) ctx.closePath();
      if (sPts.length >= 3) {
        ctx.fillStyle = 'rgba(0, 230, 118, 0.16)';
        ctx.fill();
      }
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      for (let i = 0; i < sPts.length; i++) {
        drawPointHandle(sPts[i].sx, sPts[i].sy, sPts[i].snapType, activeDragList === 'area' && activeDragIdx === i, `${i + 1}`);
      }
    }

    // 3. Дуга и разбивка для колышков
    if (arcPts.length) {
      const sPts = arcPts.map(p => {
        const [sx, sy] = worldToScreen(p.x, p.y);
        return { sx, sy, snapType: p.snapType };
      });

      if (arcPts.length === 3) {
        const info = solveArc3Pts(arcPts[0], arcPts[1], arcPts[2]);
        if (info) {
          // Хорда (шнурка от начала до конца)
          const [x1s, y1s] = worldToScreen(arcPts[0].x, arcPts[0].y);
          const [x3s, y3s] = worldToScreen(arcPts[2].x, arcPts[2].y);
          ctx.save();
          ctx.strokeStyle = '#00e5ff';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(x1s, y1s);
          ctx.lineTo(x3s, y3s);
          ctx.stroke();
          ctx.restore();

          // Подсвеченная дуга в мировых координатах
          ctx.save();
          ctx.translate(offsetX, offsetY);
          ctx.scale(scale, -scale);
          ctx.strokeStyle = '#ffd60a';
          ctx.lineWidth = 2.5 / scale;
          ctx.beginPath();
          ctx.arc(info.center.x, info.center.y, info.radius, info.a1, info.a3, info.antiClockwise);
          ctx.stroke();
          ctx.restore();

          // Центр дуги (крестик)
          const [csx, csy] = worldToScreen(info.center.x, info.center.y);
          ctx.save();
          ctx.strokeStyle = '#ff2d55';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(csx - 10, csy); ctx.lineTo(csx + 10, csy);
          ctx.moveTo(csx, csy - 10); ctx.lineTo(csx, csy + 10);
          ctx.stroke();
          ctx.font = 'bold 11px system-ui, sans-serif';
          ctx.fillStyle = '#ff2d55';
          ctx.fillText('ЦЕНТР', csx + 8, csy - 6);
          ctx.restore();

          // Перпендикуляры от шнурки к дуге с шагом
          const isMeters = info.radius < 50;
          const stepM = Math.max(0.1, parseFloat(stepInput.value) || 0.5);
          const stepRaw = isMeters ? stepM : stepM * 1000;

          ctx.save();
          ctx.strokeStyle = 'rgba(255, 214, 10, 0.7)';
          ctx.lineWidth = 1.2;
          ctx.font = '10px system-ui, sans-serif';
          ctx.fillStyle = '#ffd60a';
          for (let s = stepRaw; s < info.chordLen - stepRaw * 0.25; s += stepRaw) {
            const off = info.getOffsetAt(s);
            const bx = arcPts[0].x + info.ux * s;
            const by = arcPts[0].y + info.uy * s;
            const ax = bx + info.px * off;
            const ay = by + info.py * off;

            const [bsx, bsy] = worldToScreen(bx, by);
            const [asx, asy] = worldToScreen(ax, ay);

            ctx.beginPath();
            ctx.moveTo(bsx, bsy);
            ctx.lineTo(asx, asy);
            ctx.stroke();

            const valStr = isMeters ? `${Math.abs(off).toFixed(2)}м` : `${Math.round(Math.abs(off))}`;
            ctx.fillText(valStr, asx + 4, asy - 3);
          }
          ctx.restore();
        }
      }

      for (let i = 0; i < sPts.length; i++) {
        drawPointHandle(sPts[i].sx, sPts[i].sy, sPts[i].snapType, activeDragList === 'arc' && activeDragIdx === i, `${i + 1}`);
      }
    }

    // Лупа при перетаскивании любой точки
    let loupeTarget = null;
    if (activeDragIdx !== null) {
      if (activeDragList === 'measure') loupeTarget = measurePts[activeDragIdx];
      else if (activeDragList === 'area') loupeTarget = areaPts[activeDragIdx];
      else if (activeDragList === 'arc') loupeTarget = arcPts[activeDragIdx];
    }
    if (loupeTarget) drawLoupe(loupeTarget);
  }

  function hitTestList(list, sx, sy) {
    let hitIdx = null, bestD = 34 * 34;
    for (let i = 0; i < list.length; i++) {
      const [px, py] = worldToScreen(list[i].x, list[i].y);
      const d = (px - sx) * (px - sx) + (py - sy) * (py - sy);
      if (d < bestD) { bestD = d; hitIdx = i; }
    }
    return hitIdx;
  }

  let pointers = new Map(), lastDist = 0, lastCenter = null;
  let downPos = null, moved = false;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      downPos = { x: e.clientX, y: e.clientY };
      moved = false;

      if (toolMode === 'ruler' && measurePts.length) {
        const idx = hitTestList(measurePts, sx, sy);
        if (idx !== null) { activeDragList = 'measure'; activeDragIdx = idx; requestDraw(); }
      } else if (toolMode === 'area' && areaPts.length) {
        const idx = hitTestList(areaPts, sx, sy);
        if (idx !== null) { activeDragList = 'area'; activeDragIdx = idx; requestDraw(); }
      } else if (toolMode === 'arc' && arcPts.length) {
        const idx = hitTestList(arcPts, sx, sy);
        if (idx !== null) { activeDragList = 'arc'; activeDragIdx = idx; requestDraw(); }
      }
    } else if (pointers.size === 2) {
      activeDragIdx = null;
      activeDragList = null;
      moved = true;
      const [p1, p2] = [...pointers.values()];
      lastDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      lastCenter = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const curr = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, curr);

    if (pointers.size === 1) {
      if (activeDragIdx !== null && activeDragList) {
        const rect = canvas.getBoundingClientRect();
        const pt = findSnap(e.clientX - rect.left, e.clientY - rect.top);
        if (activeDragList === 'measure') {
          measurePts[activeDragIdx] = pt;
          if (measurePts.length === 2) {
            const d = Math.hypot(measurePts[1].x - measurePts[0].x, measurePts[1].y - measurePts[0].y);
            statusEl.textContent = `Замер: ${d.toFixed(1)}`;
          }
        } else if (activeDragList === 'area') {
          areaPts[activeDragIdx] = pt;
          updateAreaPanel();
        } else if (activeDragList === 'arc') {
          arcPts[activeDragIdx] = pt;
          updateArcPanel();
        }
        requestDraw();
        return;
      }

      if (downPos && Math.hypot(curr.x - downPos.x, curr.y - downPos.y) > 8) moved = true;
      offsetX += curr.x - prev.x;
      offsetY += curr.y - prev.y;
      requestDraw();
    } else if (pointers.size === 2) {
      const [p1, p2] = [...pointers.values()];
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const center = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      if (lastDist > 0) {
        const factor = dist / lastDist;
        offsetX = center.x - (center.x - offsetX) * factor + (center.x - lastCenter.x);
        offsetY = center.y - (center.y - offsetY) * factor + (center.y - lastCenter.y);
        scale *= factor;
        requestDraw();
      }
      lastDist = dist;
      lastCenter = center;
    }
  });

  const endPointer = (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;

    if (activeDragIdx !== null) {
      if (activeDragList === 'measure' && measurePts.length === 1) {
        const [p0x, p0y] = worldToScreen(measurePts[0].x, measurePts[0].y);
        const shiftX = p0x + 80 < canvas.clientWidth ? 80 : -80;
        measurePts.push(findSnap(p0x + shiftX, p0y));
        statusEl.textContent = 'Тащи точку 2';
      }
      activeDragIdx = null;
      activeDragList = null;
      requestDraw();
    } else if (!moved && pointers.size === 1) {
      if (toolMode === 'ruler') {
        const pt = findSnap(sx, sy);
        if (measurePts.length >= 2) measurePts = [pt];
        else measurePts.push(pt);
        requestDraw();
      } else if (toolMode === 'area') {
        areaPts.push(findSnap(sx, sy));
        updateAreaPanel();
        requestDraw();
      } else if (toolMode === 'arc') {
        if (arcPts.length >= 3) arcPts = [findSnap(sx, sy)];
        else arcPts.push(findSnap(sx, sy));
        updateArcPanel();
        requestDraw();
      }
    }
    pointers.delete(e.pointerId);
    lastDist = 0;
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    offsetX = mx - (mx - offsetX) * factor;
    offsetY = my - (my - offsetY) * factor;
    scale *= factor;
    requestDraw();
  }, { passive: false });

  // Регистрация Service Worker для офлайн-работы PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
