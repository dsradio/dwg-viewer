<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DWG Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #141414; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px; background: #202020; border-bottom: 1px solid #333; z-index: 10; }
    .btn { background: #2e2e2e; color: #fff; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .btn:active { background: #444; }
    .btn-primary { background: #e65100; border-color: #ff6d00; font-weight: 600; }
    #status { margin-left: auto; font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    canvas { flex: 1; width: 100%; height: 100%; touch-action: none; display: block; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<header>
  <label class="btn btn-primary">
    Открыть DWG
    <input type="file" id="fileInput" accept=".dwg">
  </label>
  <button class="btn" id="fitBtn">Вписать</button>
  <div id="status">Загрузка движка...</div>
</header>

<canvas id="canvas"></canvas>

<script type="module">
  import { LibreDwg, Dwg_File_Type } from 'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/dist/libredwg-web.js';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const fileInput = document.getElementById('fileInput');
  const fitBtn = document.getElementById('fitBtn');

  let libredwg = null;
  let entities = [];
  let blocks = {};
  let bounds = null;

  let scale = 1, offsetX = 0, offsetY = 0;

  (async () => {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/wasm',
      'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/dist',
      'https://unpkg.com/@mlightcad/libredwg-web/wasm'
    ];
    for (const url of urls) {
      try {
        libredwg = await LibreDwg.create(url);
        statusEl.textContent = 'Готов';
        return;
      } catch (e) {}
    }
    statusEl.textContent = 'Ошибка WASM';
  })();

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);
  resize();

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !libredwg) return;

    statusEl.textContent = 'Читаю...';
    try {
      const buffer = await file.arrayBuffer();
      const dwg = libredwg.dwg_read_data(new Uint8Array(buffer), Dwg_File_Type.DWG);
      const db = libredwg.convert(dwg);
      libredwg.dwg_free(dwg);

      entities = db.entities || [];
      blocks = {};
      const br = db.tables?.BLOCK_RECORD?.entries || [];
      for (const b of br) {
        if (b.name && b.entities) blocks[b.name] = b.entities;
      }

      // Считаем типы объектов для диагностики
      const counts = {};
      for (const ent of entities) counts[ent.type] = (counts[ent.type] || 0) + 1;
      const summary = Object.entries(counts).slice(0, 4).map(([k, v]) => `${k}:${v}`).join(' ');

      calcBounds();
      fitToScreen();
      statusEl.textContent = `${entities.length} эл. (${summary || 'пусто'})`;
    } catch (err) {
      statusEl.textContent = 'Ошибка: ' + err.message;
    }
  });

  function walkEntities(list, fn, depth = 0, m = [1, 0, 0, 1, 0, 0]) {
    if (depth > 8 || !list) return;
    for (const e of list) {
      if (e.type === 'INSERT' && e.name && blocks[e.name]) {
        const ip = e.insertionPoint || { x: 0, y: 0 };
        const sx = e.xScale ?? 1, sy = e.yScale ?? 1;
        const rot = e.rotation || 0;
        const c = Math.cos(rot), s = Math.sin(rot);
        // Умножение матриц трансформации блока
        const nm = [
          m[0]*c*sx + m[2]*s*sx,
          m[1]*c*sx + m[3]*s*sx,
          m[0]*(-s)*sy + m[2]*c*sy,
          m[1]*(-s)*sy + m[3]*c*sy,
          m[0]*ip.x + m[2]*ip.y + m[4],
          m[1]*ip.x + m[3]*ip.y + m[5]
        ];
        walkEntities(blocks[e.name], fn, depth + 1, nm);
      } else {
        fn(e, m);
      }
    }
  }

  function tx(m, x, y) {
    return [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]];
  }

  function calcBounds() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const add = (m, x, y) => {
      if (!Number.isFinite(x) || !Number.isFinite(y)) return;
      const [px, py] = tx(m, x, y);
      if (Math.abs(px) > 1e8 || Math.abs(py) > 1e8) return;
      if (px < minX) minX = px;
      if (py < minY) minY = py;
      if (px > maxX) maxX = px;
      if (py > maxY) maxY = py;
    };

    walkEntities(entities, (e, m) => {
      if (e.type === 'LINE' && e.startPoint && e.endPoint) {
        add(m, e.startPoint.x, e.startPoint.y);
        add(m, e.endPoint.x, e.endPoint.y);
      } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices) {
        for (const v of e.vertices) add(m, v.x, v.y);
      } else if ((e.type === 'CIRCLE' || e.type === 'ARC') && e.center) {
        add(m, e.center.x - e.radius, e.center.y - e.radius);
        add(m, e.center.x + e.radius, e.center.y + e.radius);
      }
    });
    bounds = minX < Infinity ? { minX, minY, maxX, maxY } : null;
  }

  function fitToScreen() {
    if (!bounds) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const bw = bounds.maxX - bounds.minX || 1;
    const bh = bounds.maxY - bounds.minY || 1;
    scale = Math.min(w / bw, h / bh) * 0.9;
    offsetX = w / 2 - ((bounds.minX + bounds.maxX) / 2) * scale;
    offsetY = h / 2 + ((bounds.minY + bounds.maxY) / 2) * scale;
    draw();
  }
  fitBtn.addEventListener('click', fitToScreen);

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    if (!entities.length) return;

    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, -scale);
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1 / scale;

    ctx.beginPath();
    walkEntities(entities, (e, m) => {
      if (e.type === 'LINE' && e.startPoint && e.endPoint) {
        const [x1, y1] = tx(m, e.startPoint.x, e.startPoint.y);
        const [x2, y2] = tx(m, e.endPoint.x, e.endPoint.y);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
      } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices?.length > 1) {
        const [x0, y0] = tx(m, e.vertices[0].x, e.vertices[0].y);
        ctx.moveTo(x0, y0);
        for (let i = 1; i < e.vertices.length; i++) {
          const [xi, yi] = tx(m, e.vertices[i].x, e.vertices[i].y);
          ctx.lineTo(xi, yi);
        }
        if (e.flag & 1) ctx.lineTo(x0, y0);
      } else if (e.type === 'CIRCLE' && e.center) {
        const [cx, cy] = tx(m, e.center.x, e.center.y);
        const r = e.radius * Math.hypot(m[0], m[1]);
        ctx.moveTo(cx + r, cy);
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
      } else if (e.type === 'ARC' && e.center) {
        const [cx, cy] = tx(m, e.center.x, e.center.y);
        const r = e.radius * Math.hypot(m[0], m[1]);
        const sx = cx + Math.cos(e.startAngle) * r;
        const sy = cy + Math.sin(e.startAngle) * r;
        ctx.moveTo(sx, sy);
        ctx.arc(cx, cy, r, e.startAngle, e.endAngle);
      }
    });
    ctx.stroke();
    ctx.restore();
  }

  let pointers = new Map(), lastDist = 0, lastCenter = null;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [p1, p2] = [...pointers.values()];
      lastDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      lastCenter = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const curr = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, curr);

    if (pointers.size === 1) {
      offsetX += curr.x - prev.x;
      offsetY += curr.y - prev.y;
      draw();
    } else if (pointers.size === 2) {
      const [p1, p2] = [...pointers.values()];
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const center = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      if (lastDist > 0) {
        const factor = dist / lastDist;
        offsetX = center.x - (center.x - offsetX) * factor + (center.x - lastCenter.x);
        offsetY = center.y - (center.y - offsetY) * factor + (center.y - lastCenter.y);
        scale *= factor;
        draw();
      }
      lastDist = dist;
      lastCenter = center;
    }
  });

  const endPointer = (e) => { pointers.delete(e.pointerId); lastDist = 0; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    offsetX = mx - (mx - offsetX) * factor;
    offsetY = my - (my - offsetY) * factor;
    scale *= factor;
    draw();
  }, { passive: false });
</script>

</body>
</html>
