<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DWG Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #141414; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #202020; border-bottom: 1px solid #333; z-index: 10; }
    .btn { background: #2e2e2e; color: #fff; border: 1px solid #444; padding: 8px 11px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn:active { background: #444; }
    .btn-primary { background: #e65100; border-color: #ff6d00; font-weight: 600; }
    .btn-active { background: #2e7d32; border-color: #4caf50; font-weight: 600; }
    #status { margin-left: auto; font-size: 11px; color: #bbb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    canvas { flex: 1; width: 100%; height: 100%; touch-action: none; display: block; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<header>
  <label class="btn btn-primary">
    DWG
    <input type="file" id="fileInput" accept=".dwg">
  </label>
  <button class="btn" id="fitBtn">Центровать</button>
  <button class="btn" id="rulerBtn">Линейка</button>
  <div id="status">Загрузка...</div>
</header>

<canvas id="canvas"></canvas>

<script type="module">
  import { LibreDwg, Dwg_File_Type } from 'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/dist/libredwg-web.js';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const fileInput = document.getElementById('fileInput');
  const fitBtn = document.getElementById('fitBtn');
  const rulerBtn = document.getElementById('rulerBtn');

  let libredwg = null;
  let blocks = {};
  let layers = {};
  let bakedPaths = new Map();
  let bakedTexts = [];
  let snapPoints = [];   // [x, y, ...] углы, концы, центры
  let snapSegments = []; // [x1, y1, x2, y2, ...] отрезки для примагничивания к самой линии
  let bounds = null;

  let scale = 1, offsetX = 0, offsetY = 0;
  let rafId = null;

  // Линейка и лупа
  let measureMode = false;
  let measurePts = []; // [{x, y, snapType: 'point'|'line'|null}]
  let activeDragIdx = null;

  const ACI = {
    1: '#ff3b30', 2: '#ffd60a', 3: '#34c759', 4: '#32ade6',
    5: '#0a84ff', 6: '#ff2d55', 7: '#e5e5e5', 8: '#8e8e93', 9: '#c7c7cc',
    10: '#ff3b30', 30: '#ff9500', 40: '#ffcc00', 50: '#a8e61d',
    90: '#30d158', 130: '#5ac8fa', 150: '#007aff', 170: '#5856d6',
    210: '#af52de', 230: '#ff2d55', 250: '#48484a', 251: '#636366',
    252: '#8e8e93', 253: '#aeaeb2', 254: '#d1d1d6', 255: '#ffffff'
  };

  function aciToHex(idx) {
    const i = Math.abs(idx || 7);
    if (ACI[i]) return ACI[i];
    if (i >= 10 && i <= 249) {
      const hue = Math.round(((i - 10) / 240) * 360);
      return `hsl(${hue}, 80%, 60%)`;
    }
    return '#e5e5e5';
  }

  function resolveColor(e, parentColor = '#e5e5e5') {
    if (e.color && typeof e.color === 'number' && e.color > 0) {
      return '#' + (e.color & 0xffffff).toString(16).padStart(6, '0');
    }
    const ci = e.colorIndex;
    if (ci === 0) return parentColor;
    if (ci !== undefined && ci !== null && ci !== 256) return aciToHex(ci);
    return layers[e.layer] || parentColor;
  }

  (async () => {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/wasm',
      'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web/dist',
      'https://unpkg.com/@mlightcad/libredwg-web/wasm'
    ];
    for (const url of urls) {
      try {
        libredwg = await LibreDwg.create(url);
        statusEl.textContent = 'Готов';
        return;
      } catch (e) {}
    }
    statusEl.textContent = 'Ошибка WASM';
  })();

  function requestDraw() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      draw();
    });
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    requestDraw();
  }
  window.addEventListener('resize', resize);
  resize();

  rulerBtn.addEventListener('click', () => {
    measureMode = !measureMode;
    activeDragIdx = null;
    rulerBtn.classList.toggle('btn-active', measureMode);
    if (measureMode) {
      const pt = findSnap(canvas.clientWidth / 2, canvas.clientHeight / 2);
      measurePts = [pt];
      statusEl.textContent = 'Тащи точку 1';
    } else {
      measurePts = [];
      statusEl.textContent = 'Готов';
    }
    requestDraw();
  });

  function cleanText(raw) {
    if (raw === undefined || raw === null) return '';
    return String(raw)
      .replace(/\\P/g, ' ')
      .replace(/\\[A-Za-z][^;]*;/g, '')
      .replace(/[{}]/g, '')
      .replace(/%%[cC]/g, 'Ø')
      .replace(/%%[dD]/g, '°')
      .replace(/%%[pP]/g, '±')
      .trim();
  }

  function tx(m, x, y) {
    return [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]];
  }

  function walkEntities(list, fn, depth = 0, m = [1, 0, 0, 1, 0, 0], parentColor = '#e5e5e5') {
    if (depth > 8 || !list) return;
    for (const e of list) {
      const col = resolveColor(e, parentColor);
      const bName = e.name || e.blockName;
      if (e.type === 'INSERT' && bName && blocks[bName]) {
        const ip = e.insertionPoint || { x: 0, y: 0 };
        const sx = e.xScale ?? 1, sy = e.yScale ?? 1;
        const rot = e.rotation || 0;
        const c = Math.cos(rot), s = Math.sin(rot);
        const nm = [
          m[0]*c*sx + m[2]*s*sx,
          m[1]*c*sx + m[3]*s*sx,
          m[0]*(-s)*sy + m[2]*c*sy,
          m[1]*(-s)*sy + m[3]*c*sy,
          m[0]*ip.x + m[2]*ip.y + m[4],
          m[1]*ip.x + m[3]*ip.y + m[5]
        ];
        walkEntities(blocks[bName], fn, depth + 1, nm, col);
      } else if (e.type && e.type.startsWith('DIMENSION')) {
        if (bName && blocks[bName]) {
          walkEntities(blocks[bName], fn, depth + 1, m, col);
        } else {
          fn(e, m, col);
        }
      } else {
        fn(e, m, col);
      }
    }
  }

  function bakeGeometry(entities) {
    const paths = new Map();
    const texts = [];
    const snaps = [];
    const segs = [];
    const skipped = {};
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    const getPath = (col) => {
      let p = paths.get(col);
      if (!p) { p = new Path2D(); paths.set(col, p); }
      return p;
    };

    const addBound = (px, py, isSnap = false) => {
      if (!Number.isFinite(px) || !Number.isFinite(py)) return;
      if (Math.abs(px) > 1e8 || Math.abs(py) > 1e8) return;
      if (px < minX) minX = px;
      if (py < minY) minY = py;
      if (px > maxX) maxX = px;
      if (py > maxY) maxY = py;
      if (isSnap && snaps.length < 120000) snaps.push(px, py);
    };

    const addSeg = (x1, y1, x2, y2) => {
      if (segs.length < 200000) segs.push(x1, y1, x2, y2);
    };

    walkEntities(entities, (e, m, col) => {
      const t = e.type || '';

      if (t === 'LINE' && e.startPoint && e.endPoint) {
        const [x1, y1] = tx(m, e.startPoint.x, e.startPoint.y);
        const [x2, y2] = tx(m, e.endPoint.x, e.endPoint.y);
        const p = getPath(col);
        p.moveTo(x1, y1);
        p.lineTo(x2, y2);
        addBound(x1, y1, true);
        addBound(x2, y2, true);
        addSeg(x1, y1, x2, y2);
      } else if (t.includes('POLYLINE') && e.vertices?.length > 1) {
        const p = getPath(col);
        let [px, py] = tx(m, e.vertices[0].x, e.vertices[0].y);
        const [x0, y0] = [px, py];
        p.moveTo(x0, y0);
        addBound(x0, y0, true);
        for (let i = 1; i < e.vertices.length; i++) {
          const [xi, yi] = tx(m, e.vertices[i].x, e.vertices[i].y);
          p.lineTo(xi, yi);
          addBound(xi, yi, true);
          addSeg(px, py, xi, yi);
          px = xi; py = yi;
        }
        if (e.flag & 1) {
          p.lineTo(x0, y0);
          addSeg(px, py, x0, y0);
        }
      } else if (t === 'CIRCLE' && e.center) {
        const [cx, cy] = tx(m, e.center.x, e.center.y);
        const r = e.radius * Math.hypot(m[0], m[1]);
        if (r > 0 && Number.isFinite(r)) {
          const p = getPath(col);
          p.moveTo(cx + r, cy);
          p.arc(cx, cy, r, 0, Math.PI * 2);
          addBound(cx, cy, true);
          addBound(cx - r, cy - r);
          addBound(cx + r, cy + r);
        }
      } else if (t === 'ARC' && e.center) {
        const [cx, cy] = tx(m, e.center.x, e.center.y);
        const r = e.radius * Math.hypot(m[0], m[1]);
        if (r > 0 && Number.isFinite(r)) {
          const p = getPath(col);
          const sx = cx + Math.cos(e.startAngle) * r;
          const sy = cy + Math.sin(e.startAngle) * r;
          const ex = cx + Math.cos(e.endAngle) * r;
          const ey = cy + Math.sin(e.endAngle) * r;
          p.moveTo(sx, sy);
          p.arc(cx, cy, r, e.startAngle, e.endAngle);
          addBound(cx, cy, true);
          addBound(sx, sy, true);
          addBound(ex, ey, true);
        }
      } else if (t === 'SPLINE') {
        const pts = e.fitPoints?.length ? e.fitPoints : e.controlPoints;
        if (pts && pts.length > 1) {
          const p = getPath(col);
          let [px, py] = tx(m, pts[0].x, pts[0].y);
          p.moveTo(px, py);
          addBound(px, py, true);
          for (let i = 1; i < pts.length; i++) {
            const [xi, yi] = tx(m, pts[i].x, pts[i].y);
            p.lineTo(xi, yi);
            addBound(xi, yi);
            addSeg(px, py, xi, yi);
            px = xi; py = yi;
          }
        }
      } else if (t === 'ELLIPSE' && e.center && e.majorAxisEndPoint) {
        const [cx, cy] = tx(m, e.center.x, e.center.y);
        const sc = Math.hypot(m[0], m[1]);
        const rx = Math.hypot(e.majorAxisEndPoint.x, e.majorAxisEndPoint.y) * sc;
        const ry = rx * (e.axisRatio || 1);
        const rot = Math.atan2(e.majorAxisEndPoint.y, e.majorAxisEndPoint.x);
        const start = e.startAngle ?? 0;
        const end = e.endAngle ?? Math.PI * 2;
        if (rx > 0 && ry > 0) {
          const p = getPath(col);
          p.moveTo(
            cx + rx * Math.cos(start) * Math.cos(rot) - ry * Math.sin(start) * Math.sin(rot),
            cy + rx * Math.cos(start) * Math.sin(rot) + ry * Math.sin(start) * Math.cos(rot)
          );
          p.ellipse(cx, cy, rx, ry, rot, start, end);
          addBound(cx, cy, true);
        }
      } else if (t === 'SOLID' || t === '3DFACE' || t === 'TRACE') {
        const pts = [e.corner1, e.corner2, e.corner4, e.corner3].filter(Boolean);
        if (pts.length >= 3) {
          const p = getPath(col);
          let [x0, y0] = tx(m, pts[0].x, pts[0].y);
          let px = x0, py = y0;
          p.moveTo(x0, y0);
          addBound(x0, y0, true);
          for (let i = 1; i < pts.length; i++) {
            const [xi, yi] = tx(m, pts[i].x, pts[i].y);
            p.lineTo(xi, yi);
            addBound(xi, yi, true);
            addSeg(px, py, xi, yi);
            px = xi; py = yi;
          }
          p.lineTo(x0, y0);
          addSeg(px, py, x0, y0);
        }
      } else if (t === 'LEADER' && e.vertices?.length > 1) {
        const p = getPath(col);
        let [px, py] = tx(m, e.vertices[0].x, e.vertices[0].y);
        p.moveTo(px, py);
        addBound(px, py, true);
        for (let i = 1; i < e.vertices.length; i++) {
          const [xi, yi] = tx(m, e.vertices[i].x, e.vertices[i].y);
          p.lineTo(xi, yi);
          addBound(xi, yi, true);
          addSeg(px, py, xi, yi);
          px = xi; py = yi;
        }
      } else if (t === 'HATCH' && e.boundaryPaths) {
        const p = getPath(col);
        for (const bp of e.boundaryPaths) {
          const verts = bp.vertices || bp.polylinePath?.vertices;
          if (verts?.length > 1) {
            let [x0, y0] = tx(m, verts[0].x, verts[0].y);
            let px = x0, py = y0;
            p.moveTo(x0, y0);
            addBound(x0, y0);
            for (let i = 1; i < verts.length; i++) {
              const [xi, yi] = tx(m, verts[i].x, verts[i].y);
              p.lineTo(xi, yi);
              addBound(xi, yi);
              addSeg(px, py, xi, yi);
              px = xi; py = yi;
            }
            p.lineTo(x0, y0);
          } else if (bp.edges) {
            for (const ed of bp.edges) {
              if (ed.start && ed.end) {
                const [x1, y1] = tx(m, ed.start.x, ed.start.y);
                const [x2, y2] = tx(m, ed.end.x, ed.end.y);
                p.moveTo(x1, y1);
                p.lineTo(x2, y2);
                addBound(x1, y1);
                addBound(x2, y2);
                addSeg(x1, y1, x2, y2);
              }
            }
          }
        }
      } else if (t === 'TEXT' || t === 'MTEXT' || t === 'ATTRIB' || t === 'ATTDEF') {
        const pt = e.startPoint || e.insertionPoint || e.position || e.alignmentPoint;
        const str = cleanText(e.text ?? e.textString ?? e.contents);
        if (pt && str) {
          const [px, py] = tx(m, pt.x, pt.y);
          const hVal = (e.textHeight || e.height || 2.5) * Math.hypot(m[0], m[1]);
          texts.push({ x: px, y: py, str, h: hVal, rot: e.rotation || 0, col });
        }
      } else if (t.startsWith('DIMENSION')) {
        const pt = e.textPoint || e.middleOfText || e.definitionPoint;
        let str = cleanText(e.text ?? e.textString);
        if (!str || str === '<>') {
          if (Number.isFinite(e.measurement)) str = String(Math.round(e.measurement));
        }
        if (pt && str) {
          const [px, py] = tx(m, pt.x, pt.y);
          const hVal = (e.textHeight || e.height || 2.5) * Math.hypot(m[0], m[1]);
          texts.push({ x: px, y: py, str, h: hVal, rot: e.rotation || 0, col });
        }
      } else if (t && t !== 'POINT' && t !== 'VIEWPORT') {
        skipped[t] = (skipped[t] || 0) + 1;
      }
    });

    bakedPaths = paths;
    bakedTexts = texts;
    snapPoints = snaps;
    snapSegments = segs;
    bounds = minX < Infinity ? { minX, minY, maxX, maxY } : null;
    return skipped;
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !libredwg) return;

    const sizeMB = (file.size / 1024 / 1024).toFixed(1);
    statusEl.textContent = `Читаю (${sizeMB} МБ)...`;
    await new Promise(r => setTimeout(r, 30));

    try {
      const buffer = await file.arrayBuffer();
      const dwg = libredwg.dwg_read_data(new Uint8Array(buffer), Dwg_File_Type.DWG);
      if (!dwg) {
        statusEl.textContent = `Не прочитан (${sizeMB} МБ)`;
        return;
      }

      const db = libredwg.convert(dwg);
      libredwg.dwg_free(dwg);

      layers = {};
      for (const l of (db.tables?.LAYER?.entries || [])) {
        if (!l.name) continue;
        layers[l.name] = (l.color && typeof l.color === 'number' && l.color > 0)
          ? '#' + (l.color & 0xffffff).toString(16).padStart(6, '0')
          : aciToHex(l.colorIndex ?? 7);
      }

      blocks = {};
      for (const b of (db.tables?.BLOCK_RECORD?.entries || [])) {
        if (b.name && b.entities) blocks[b.name] = b.entities;
      }

      let entities = db.entities || [];
      if (!entities.length && blocks['*Paper_Space']?.length) {
        entities = blocks['*Paper_Space'];
      }

      measurePts = [];
      activeDragIdx = null;
      if (!entities.length) {
        bakedPaths.clear();
        bakedTexts = [];
        snapPoints = [];
        snapSegments = [];
        bounds = null;
        statusEl.textContent = 'Пусто (0 эл.)';
        requestDraw();
        return;
      }

      statusEl.textContent = `Сборка (${entities.length} эл.)...`;
      await new Promise(r => setTimeout(r, 15));

      const skipped = bakeGeometry(entities);
      fitToScreen();

      const skipTop = Object.entries(skipped).sort((a, b) => b[1] - a[1]).slice(0, 2)
        .map(([k, v]) => `${k}:${v}`).join(' ');
      statusEl.textContent = skipTop
        ? `${entities.length} эл. | скрыто: ${skipTop}`
        : `${entities.length} эл. | OK`;
    } catch (err) {
      statusEl.textContent = `Сбой: ${err.message || err}`;
      console.error(err);
    }
  });

  function fitToScreen() {
    if (!bounds) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const bw = bounds.maxX - bounds.minX || 1;
    const bh = bounds.maxY - bounds.minY || 1;
    scale = Math.min(w / bw, h / bh) * 0.9;
    offsetX = w / 2 - ((bounds.minX + bounds.maxX) / 2) * scale;
    offsetY = h / 2 + ((bounds.minY + bounds.maxY) / 2) * scale;
    requestDraw();
  }
  fitBtn.addEventListener('click', fitToScreen);

  function screenToWorld(sx, sy) {
    return [(sx - offsetX) / scale, (offsetY - sy) / scale];
  }

  // Магнитная привязка: 1) к углам/концам, 2) к самой линии
  function findSnap(sx, sy) {
    // Приоритет 1: углы, концы линий, центры (радиус 26px)
    let bestDist = 26 * 26;
    let bestPt = null;
    for (let i = 0; i < snapPoints.length; i += 2) {
      const wx = snapPoints[i], wy = snapPoints[i + 1];
      const px = offsetX + wx * scale;
      const py = offsetY - wy * scale;
      const d = (px - sx) * (px - sx) + (py - sy) * (py - sy);
      if (d < bestDist) {
        bestDist = d;
        bestPt = { x: wx, y: wy, snapType: 'point' };
      }
    }
    if (bestPt) return bestPt;

    // Приоритет 2: ближайшая точка на любой линии (радиус 20px)
    let bestSegDist = 20 * 20;
    let bestSegPt = null;
    for (let i = 0; i < snapSegments.length; i += 4) {
      const x1 = offsetX + snapSegments[i] * scale;
      const y1 = offsetY - snapSegments[i + 1] * scale;
      const x2 = offsetX + snapSegments[i + 2] * scale;
      const y2 = offsetY - snapSegments[i + 3] * scale;
      const dx = x2 - x1, dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq < 1) continue;
      let t = ((sx - x1) * dx + (sy - y1) * dy) / lenSq;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      const projX = x1 + t * dx;
      const projY = y1 + t * dy;
      const d = (projX - sx) * (projX - sx) + (projY - sy) * (projY - sy);
      if (d < bestSegDist) {
        bestSegDist = d;
        bestSegPt = {
          x: snapSegments[i] + t * (snapSegments[i + 2] - snapSegments[i]),
          y: snapSegments[i + 1] + t * (snapSegments[i + 3] - snapSegments[i + 1]),
          snapType: 'line'
        };
      }
    }
    if (bestSegPt) return bestSegPt;

    const [wx, wy] = screenToWorld(sx, sy);
    return { x: wx, y: wy, snapType: null };
  }

  function snapColor(snapType) {
    if (snapType === 'point') return '#00e676'; // зелёный — угол/конец
    if (snapType === 'line') return '#00e5ff';  // голубой — на линии
    return '#ff9100';                           // оранжевый — свободно
  }

  function drawLoupe(pt) {
    const r = 68;
    const cx = 16 + r;
    const cy = 16 + r;
    const loupeScale = scale * 3.0;
    const col = snapColor(pt.snapType);

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#101010';
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    if (bakedPaths.size) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(loupeScale, -loupeScale);
      ctx.translate(-pt.x, -pt.y);
      ctx.lineWidth = 1.4 / loupeScale;
      for (const [c, path] of bakedPaths) {
        ctx.strokeStyle = c;
        ctx.stroke(path);
      }
      ctx.restore();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();

    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - 7, cy - 7, 14, 14);
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    if (bakedPaths.size) {
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, -scale);
      ctx.lineWidth = 1 / scale;
      for (const [col, path] of bakedPaths) {
        ctx.strokeStyle = col;
        ctx.stroke(path);
      }
      ctx.restore();
    }

    for (let i = 0; i < bakedTexts.length; i++) {
      const t = bakedTexts[i];
      const pxH = t.h * scale;
      if (pxH < 5) continue;
      const sx = offsetX + t.x * scale;
      const sy = offsetY - t.y * scale;
      if (sx < -200 || sx > w + 200 || sy < -50 || sy > h + 50) continue;

      ctx.save();
      ctx.translate(sx, sy);
      if (t.rot) ctx.rotate(-t.rot);
      ctx.fillStyle = t.col || '#ffd54f';
      ctx.font = `${Math.min(pxH, 60)}px sans-serif`;
      ctx.fillText(t.str, 0, 0);
      ctx.restore();
    }

    // Линейка
    if (measurePts.length) {
      const ptsScreen = measurePts.map(p => ({
        sx: offsetX + p.x * scale,
        sy: offsetY - p.y * scale,
        snapType: p.snapType
      }));

      if (ptsScreen.length === 2) {
        const [a, b] = ptsScreen;
        ctx.save();
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(a.sx, a.sy);
        ctx.lineTo(b.sx, b.sy);
        ctx.stroke();
        ctx.restore();

        const dist = Math.hypot(measurePts[1].x - measurePts[0].x, measurePts[1].y - measurePts[0].y);
        const label = dist >= 1000 ? `${dist.toFixed(0)} (${(dist / 1000).toFixed(2)} м)` : dist.toFixed(1);
        const mx = (a.sx + b.sx) / 2;
        const my = (a.sy + b.sy) / 2 - 14;

        ctx.save();
        ctx.font = 'bold 14px system-ui, sans-serif';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(mx - tw / 2 - 6, my - 15, tw + 12, 22);
        ctx.fillStyle = '#00e676';
        ctx.textAlign = 'center';
        ctx.fillText(label, mx, my);
        ctx.restore();
      }

      for (let i = 0; i < ptsScreen.length; i++) {
        const p = ptsScreen[i];
        const col = snapColor(p.snapType);
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, 16, 0, Math.PI * 2);
        ctx.fillStyle = i === activeDragIdx ? 'rgba(0, 230, 118, 0.25)' : 'rgba(255, 255, 255, 0.12)';
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeRect(p.sx - 4, p.sy - 4, 8, 8);
        ctx.restore();
      }
    }

    if (activeDragIdx !== null && measurePts[activeDragIdx]) {
      drawLoupe(measurePts[activeDragIdx]);
    }
  }

  let pointers = new Map(), lastDist = 0, lastCenter = null;
  let downPos = null, moved = false;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      downPos = { x: e.clientX, y: e.clientY };
      moved = false;

      if (measureMode && measurePts.length) {
        let hitIdx = null, bestD = 36 * 36;
        for (let i = 0; i < measurePts.length; i++) {
          const px = offsetX + measurePts[i].x * scale;
          const py = offsetY - measurePts[i].y * scale;
          const d = (px - sx) * (px - sx) + (py - sy) * (py - sy);
          if (d < bestD) { bestD = d; hitIdx = i; }
        }
        if (hitIdx !== null) {
          activeDragIdx = hitIdx;
          requestDraw();
        }
      }
    } else if (pointers.size === 2) {
      activeDragIdx = null;
      moved = true;
      const [p1, p2] = [...pointers.values()];
      lastDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      lastCenter = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const curr = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, curr);

    if (pointers.size === 1) {
      if (activeDragIdx !== null) {
        const rect = canvas.getBoundingClientRect();
        measurePts[activeDragIdx] = findSnap(e.clientX - rect.left, e.clientY - rect.top);
        if (measurePts.length === 2) {
          const d = Math.hypot(measurePts[1].x - measurePts[0].x, measurePts[1].y - measurePts[0].y);
          statusEl.textContent = `Замер: ${d.toFixed(1)}`;
        } else {
          const st = measurePts[0].snapType;
          statusEl.textContent = st === 'point' ? 'Угол!' : st === 'line' ? 'Линия!' : 'Точка 1';
        }
        requestDraw();
        return;
      }

      if (downPos && Math.hypot(curr.x - downPos.x, curr.y - downPos.y) > 8) moved = true;
      offsetX += curr.x - prev.x;
      offsetY += curr.y - prev.y;
      requestDraw();
    } else if (pointers.size === 2) {
      const [p1, p2] = [...pointers.values()];
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const center = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      if (lastDist > 0) {
        const factor = dist / lastDist;
        offsetX = center.x - (center.x - offsetX) * factor + (center.x - lastCenter.x);
        offsetY = center.y - (center.y - offsetY) * factor + (center.y - lastCenter.y);
        scale *= factor;
        requestDraw();
      }
      lastDist = dist;
      lastCenter = center;
    }
  });

  const endPointer = (e) => {
    if (activeDragIdx !== null) {
      if (measurePts.length === 1) {
        const p0x = offsetX + measurePts[0].x * scale;
        const p0y = offsetY - measurePts[0].y * scale;
        const shiftX = p0x + 80 < canvas.clientWidth ? 80 : -80;
        measurePts.push(findSnap(p0x + shiftX, p0y));
        statusEl.textContent = 'Тащи точку 2';
      }
      activeDragIdx = null;
      requestDraw();
    } else if (measureMode && !moved && pointers.size === 1) {
      const rect = canvas.getBoundingClientRect();
      const pt = findSnap(e.clientX - rect.left, e.clientY - rect.top);
      if (measurePts.length >= 2) measurePts = [pt];
      else measurePts.push(pt);
      requestDraw();
    }
    pointers.delete(e.pointerId);
    lastDist = 0;
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    offsetX = mx - (mx - offsetX) * factor;
    offsetY = my - (my - offsetY) * factor;
    scale *= factor;
    requestDraw();
  }, { passive: false });
</script>
</body>
</html>
